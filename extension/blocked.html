<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Paused for your exam</title>
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <main>
      <img src="guard.png" alt="Your study buddy guarding the gate" width="144" height="156" />
      <h1>This site is paused for your exam</h1>
      <p id="when" class="muted">It will be back when your exam is over.</p>
      <p class="cheer">Focus on your exam. You've got this!</p>
      <button id="back" type="button">Go back</button>
      <p class="small muted">A grown-up turned on exam mode. Only the number of paused visits is counted, not which site it was.</p>
    </main>
    <script src="blocked.js"></script>
  </body>
</html>
